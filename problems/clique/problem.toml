# Generic problem metadata
[meta]
abbreviation = "CLIQUE"
name = "Clique"
complexity = "NP-complete"

# Limit keys shared across all problems, evaluated on the solution run.
# These are upper bounds for a passing solution.
[limits.run]
time_ms = 1000
memory_mb = 256

# Size limits specific to the problem.
# Each key has an `input` bound (max for instances in test data) and
# a `query` bound (max that can be given to the oracle by a reduction).
[limits.size]
nodes = { input = 10_000, query = 100_000 }
edges = { input = 20_000, query = 1_000_000 }
